<!DOCTYPE html>
<html>
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
        <script src="https://cdn.jsdelivr.net/npm/phaser@v4.2.1/dist/phaser.min.js"></script>
        <!-- <link href="style.css" rel="stylesheet" type="text/css" /> -->
        <style>
            /* CSS */
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: green;
            }
            #game-container {
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
            }
        </style>
        
        <title>Title</title>
    </head>
    <body>
        <!-- HTML -->
        
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        <!-- <script src="script.js"></script> -->
        <script>
            // JS
            var config = {
                type: Phaser.AUTO,
                scale: {
                    mode: Phaser.Scale.FIT,
                    parent: 'game-container',
                    width: 1000,
                    height: 600,
                },
                physics: { 
                    default: 'arcade', 
                    arcade: { gravity: { y: 900 }, debug: true } 
                },
                scene: {
                    preload: preload,
                    create: create,
                    update: update
                }
            };

            const game = new Phaser.Game(config);

            function preload ()
            {
                this.load.image('sky', 'assets/sky.png');
            }

            function create () {
                let sky = this.add.image(500, 300, 'sky');
                sky.setDisplaySize(1000, 600);
                
                // the ball physics
                ball = this.add.rectangle(400, 300, 30, 30, 0xffffff);
                this.physics.add.existing(ball);
                ball.body.setBounce(0.7).setCollideWorldBounds(true); 
                ball.body.setGravityY(-600); // lower gravity than player (floatier and slower drop) 900 - 600 = 300 downward
                
                // the player physics (feels full effect of gravity of 900 downward)
                player = this.add.rectangle(300, 100, 40, 40, 0xff4444);
                this.physics.add.existing(player);
                player.body.setCollideWorldBounds(true);

                this.p1 = this.input.keyboard.addKeys('W,A,S,D'); // Player 1's keys
                this.p1dive = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SHIFT); // Player 1's dive key
                this.p2 = this.input.keyboard.createCursorKeys(); // Player 2's arrow keys
                this.p2dive = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.FORWARD_SLASH);  // Player 2's dive key (/)

                // net
                net = this.add.rectangle(400, 600, 10, 175, 0xffffff); // a thin white tall rectangle net
                this.physics.add.existing(net, true); // give it physics; "true" means static (never moves)
                this.physics.add.collider(ball, net); // ball bounces off the net
                this.physics.add.collider(player, net); // the player can't walk through the net
                
                // this.physics.add.overlap(ball, player, contactCheck);
                // function contactCheck() {
                //     console.log('ball is touching the player');
                // } -> same as the one below but the one below is more efficient

                this.physics.add.overlap(ball, player, () => {
                    console.log('ball is touching the player'); // checks if the ball and the player overlapped
                });
            }
            
            function update () {
                const body = player.body; 

                // player one's horizontal movement
                if (this.p1.A.isDown) {
                    body.setVelocityX(-250); // A held = move left
                } else if (this.p1.D.isDown) {
                    body.setVelocityX(250); // D held = move right
                } else {
                    body.setVelocityX(0); // otherwise, don't move
                }
                // player one's jumping movement
                if (Phaser.Input.Keyboard.JustDown(this.p1.W) && body.onFloor()) {
                    body.setVelocityY(-500);   // W just pressed AND player is on the ground = jump up
                }
                // player one's charging (TESTING in console log)
                // if (this.p1.S.isDown) {
                //     console.log('charging', this.p1.S.getDuration(), 'ms');
                // } 
                // if (Phaser.Input.Keyboard.JustUp(this.p1.S)) {
                //     console.log('released after', this.p1.S.duration, 'ms');
                // }

                // BOTH players' diving (TESTING in console log)
                if (Phaser.Input.Keyboard.JustDown(this.p1dive)) {
                    console.log('Player 1 dive key pressed');
                } 
                if (Phaser.Input.Keyboard.JustDown(this.p2dive)) {
                    console.log('Player 2 dive key pressed');
                } 

                //ball and player interaction:

                // if (Phaser.Input.Keyboard.JustUp(this.p1.S)) {
                //     const dist = Phaser.Math.Distance.Between(player.x, player.y, ball.x, ball.y);

                //     if (dist < 80) {
                //         console.log("HIT", dist);
                //     } else {
                //         console.log("miss", dist);
                //     }
                // } -> same as the one below but the one below is more efficient

                // if (Phaser.Input.Keyboard.JustUp(this.p1.S)) {          
                //     const dist = Phaser.Math.Distance.Between(player.x, player.y, ball.x, ball.y);
                //     console.log(dist < 80 ? 'HIT' : 'MISS', dist); 
                //     // checks if the center of the player and the ball's distance is less than 80. if it is, then console log 'HIT', otherwise, false = 'MISS'. The ",dist" is just to include the distance at which it is checked (for example: HIT 67.34743 or MISS 88.84323)
                //     // dist < 80 ? 'HIT' : 'MISS', dist = is distance less than 80? if it is, then print into the console 'HIT' alongside its distance. If it isn't, then print into the console 'MISS' alongside its distance.
                // }

                // if (Phaser.Input.Keyboard.JustUp(this.p1.S)) {
                //     const nearby = this.physics.overlapCirc(player.x, player.y, 80);

                //     if (nearby.includes(ball.body)) {
                //         console.log("HIT (for circle check)");
                //     } else {
                //         console.log("MISS (for circle check)");
                //     }
                // } -> same as the one below but the one below is more efficient


                if (Phaser.Input.Keyboard.JustUp(this.p1.S)) {
                    const nearby = this.physics.overlapCirc(player.x, player.y, 40);
                    console.log(nearby.includes(ball.body) ? 'HIT (for circle check)' : 'miss (for circle check)'); 
                    // when player lets go of 'S' key, phaser will draw an invisible circle around the character and scan nearby if the ball is touching it. If it is, prints 'HIT (for circle check)'. If it isn't, prints 'miss (for circle check)'
                }
            }
            
        </script>
    </body>
</html>
